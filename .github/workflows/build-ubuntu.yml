name: build-ubuntu

# Builds Dockerfile (free-threaded CPython compiled with the official gcc image's
# toolchain, on Ubuntu) and publishes it to GHCR as linux/amd64 + linux/arm64 manifests.
# GCC and CPython versions are the newest upstream releases, resolved on every run by
# resolve_versions.py.
on:
  schedule:
    # Daily: build only versions whose exact tag is not yet published (new GCC or CPython).
    - cron: "0 6 * * *"
    # Weekly: always rebuild to pick up Ubuntu security updates.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - smoke_test.py
      - resolve_versions.py
      - .github/workflows/build-ubuntu.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ubuntu
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/python
  WEEKLY_CRON: "0 7 * * 1"

jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      gcc_version: ${{ steps.meta.outputs.gcc_version }}
      os_tag: ${{ steps.meta.outputs.os_tag }}
      ubuntu_version: ${{ steps.meta.outputs.ubuntu_version }}
      pythons: ${{ steps.meta.outputs.pythons }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ubuntu stays pinned in the Dockerfile; GCC and CPython come from upstream.
      - id: meta
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          resolved="$(python3 -I resolve_versions.py)"
          gcc_version="$(jq -r .gcc <<< "$resolved")"
          ubuntu_version="$(awk -F= '$1 == "ARG UBUNTU_IMAGE" && $2 != "" { sub(/^.*:/, "", $2); print $2; exit }' Dockerfile)"
          test -n "$gcc_version" && test -n "$ubuntu_version"
          os_tag="ubuntu${ubuntu_version}-gcc${gcc_version}"
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$SCHEDULE" = "$WEEKLY_CRON" ]; then
            force=true
          else
            force=false
          fi
          # A failed inspect (missing tag or registry error) counts as unpublished, so an
          # outage costs an extra build rather than a skipped one.
          pythons='[]'
          while read -r python; do
            tag="$IMAGE:$(jq -r .version <<< "$python")t-$os_tag"
            if [ "$force" = true ] || ! docker manifest inspect "$tag" > /dev/null 2>&1; then
              echo "building $tag"
              pythons="$(jq -c --argjson python "$python" '. + [$python]' <<< "$pythons")"
            else
              echo "$tag already published; skipping"
            fi
          done < <(jq -c '.pythons[]' <<< "$resolved")
          {
            echo "gcc_version=${gcc_version}"
            echo "os_tag=${os_tag}"
            echo "ubuntu_version=${ubuntu_version}"
            echo "pythons=${pythons}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.pythons != '[]'
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.meta.outputs.pythons) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    env:
      TAG: ${{ matrix.python.version }}t-${{ needs.meta.outputs.os_tag }}-${{ matrix.arch }}
      PYTHON_VERSION: ${{ matrix.python.version }}
      PYTHON_SHA256: ${{ matrix.python.sha256 }}
      GCC_IMAGE: gcc:${{ needs.meta.outputs.gcc_version }}
    steps:
      - uses: actions/checkout@v7
      # smoke_test.py runs inside the build as its last step, so a broken image fails here.
      - name: Build
        run: |
          docker build --pull \
            --build-arg "GCC_IMAGE=$GCC_IMAGE" \
            --build-arg "PYTHON_VERSION=$PYTHON_VERSION" \
            --build-arg "PYTHON_SHA256=$PYTHON_SHA256" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$TAG" .
      - name: Record build details
        run: |
          {
            echo "### $IMAGE:$TAG"
            echo '```'
            docker run --rm "$IMAGE:$TAG" cat /usr/local/share/python-build/build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push "$IMAGE:$TAG"

  publish:
    needs: [meta, build]
    strategy:
      matrix:
        python: ${{ fromJSON(needs.meta.outputs.pythons) }}
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ matrix.python.version }}t-${{ needs.meta.outputs.os_tag }}
      MINOR_TAG: ${{ matrix.python.minor }}t-ubuntu${{ needs.meta.outputs.ubuntu_version }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:$MINOR_TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
